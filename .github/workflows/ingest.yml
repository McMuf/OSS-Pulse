name: Scheduled OSS ingestion

on:
  schedule:
    # 13:00 UTC daily. GitHub's stats endpoints are recomputed continuously
    # server-side, so any time works - this isn't aligned to anything.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets us trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the refreshed DuckDB file back to main

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run ingestion
        working-directory: backend
        env:
          PYTHONPATH: src
          # The default Actions token can read public repo data - no PAT needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m oss_pulse.ingestion.run

      - name: Commit refreshed data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/oss_pulse.duckdb
          git diff --cached --quiet && echo "No data changes." || git commit -m "Scheduled ingestion refresh"
          git push
