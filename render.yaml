services:
  - type: web
    name: oss-pulse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn oss_pulse.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: src
      - key: CORS_ALLOWED_ORIGINS
        sync: false
